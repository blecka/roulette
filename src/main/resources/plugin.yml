name: Roulette
version: 1.0.0
main: bg.roulette.Roulette
api-version: '1.21'
softdepend: [Vault]
description: PaperMC Casino Roulette Plugin
author: RouletteDev

commands:
  roulette:
    description: Основна команда за рулетка
    aliases: [rlet, casino]
    permission: roulette.use
    usage: /roulette <subcommand>

permissions:
  roulette.admin:
    description: Администраторски права за управляване на масите
    default: op
  roulette.use:
    description: Достъп до игра и залагане на рулетка
    default: true
